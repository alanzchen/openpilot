name: StarPilot auto-sync (mazda-ti)

# Merges new official StarPilot commits into a candidate branch, tests and classifies it, and opens/updates ONE
# pull request into the Mazda/TI integration branch. It never merges, deploys, flashes or force-pushes.
# Trusted scripts and policy are taken from this (default) branch, never from the candidate or upstream.

on:
  schedule:
    - cron: "23 10 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Compute and test the candidate without pushing branches or touching the PR"
        type: boolean
        default: false

permissions: {}

concurrency:
  group: starpilot-autosync
  cancel-in-progress: false

env:
  UPSTREAM_URL: https://github.com/firestar5683/StarPilot.git
  UPSTREAM_BRANCH: StarPilot
  MIRROR_BRANCH: starpilot-upstream
  INTEGRATION_BRANCH: mazda-starpilot-ti
  CANDIDATE_BRANCH: autosync/starpilot
  TRUSTED: .github/mazda-ti-sync

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write          # push the candidate and fast-forward the mirror (no force)
      pull-requests: read      # read the previous candidate PR state
    outputs:
      status: ${{ steps.sync.outputs.status }}
      candidate: ${{ steps.sync.outputs.candidate }}
      previous_upstream: ${{ steps.sync.outputs.previous_upstream }}
    steps:
      - name: Trusted scripts and policy (default branch)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: trusted
          persist-credentials: false
          sparse-checkout: .github/mazda-ti-sync

      - name: Fork history (no file contents until needed)
        uses: actions/checkout@v4
        with:
          ref: ${{ env.INTEGRATION_BRANCH }}
          path: work
          fetch-depth: 0
          filter: blob:none

      - name: Fetch mirror, candidate and official
        working-directory: work
        run: |
          git fetch --no-tags origin "+refs/heads/${MIRROR_BRANCH}:refs/remotes/origin/${MIRROR_BRANCH}" || true
          git fetch --no-tags origin "+refs/heads/${CANDIDATE_BRANCH}:refs/remotes/origin/${CANDIDATE_BRANCH}" || true
          git fetch --no-tags "${UPSTREAM_URL}" "+refs/heads/${UPSTREAM_BRANCH}:refs/remotes/upstream/${UPSTREAM_BRANCH}"

      - name: Previous candidate PR state
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          state=$(gh pr list -R "${GITHUB_REPOSITORY}" --head "${CANDIDATE_BRANCH}" --base "${INTEGRATION_BRANCH}" \
                    --state all --limit 1 --json state --jq '.[0].state // "NONE"' | tr 'A-Z' 'a-z')
          echo "state=${state}" >> "$GITHUB_OUTPUT"

      - name: Merge official into the candidate (trusted script)
        id: sync
        working-directory: work
        env:
          UPSTREAM_REF: refs/remotes/upstream/${{ env.UPSTREAM_BRANCH }}
          INTEGRATION_REF: refs/remotes/origin/${{ env.INTEGRATION_BRANCH }}
          PR_STATE: ${{ steps.pr.outputs.state }}
          POLICY_DIR: ${{ github.workspace }}/trusted/.github/mazda-ti-sync/policy
          REPORT: ${{ github.workspace }}/sync-report.md
        run: |
          if git rev-parse -q --verify "refs/remotes/origin/${CANDIDATE_BRANCH}" >/dev/null; then
            export CANDIDATE_REF="refs/remotes/origin/${CANDIDATE_BRANCH}"
          fi
          echo "previous_upstream=$(git show "${INTEGRATION_REF}:mazda-ti/UPSTREAM" | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"
          set +e
          bash "${GITHUB_WORKSPACE}/trusted/${TRUSTED}/sync/sync_upstream.sh"
          rc=$?
          set -e
          status=$(sed -n 's/^STATUS=//p' "$REPORT" | tail -1)
          echo "status=${status}" >> "$GITHUB_OUTPUT"
          echo "candidate=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          cat "$REPORT" >> "$GITHUB_STEP_SUMMARY"
          exit $rc

      - name: Push the candidate (fast-forward only), then the mirror
        if: steps.sync.outputs.status == 'MERGED' && !inputs.dry_run
        working-directory: work
        run: |
          git push origin "HEAD:refs/heads/${CANDIDATE_BRANCH}"
          git push origin "refs/remotes/upstream/${UPSTREAM_BRANCH}:refs/heads/${MIRROR_BRANCH}"

  test:
    needs: sync
    # On a real merge, test the new candidate. On a manual run with nothing new upstream, still test and classify
    # the current integration tip, so the published branch is verified on GitHub runners with the trusted policy.
    if: needs.sync.outputs.status == 'MERGED' || (needs.sync.outputs.status == 'UP_TO_DATE' && github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Trusted scripts and policy (default branch)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: trusted
          persist-credentials: false
          sparse-checkout: .github/mazda-ti-sync

      - name: Candidate (exact SHA)
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.sync.outputs.candidate }}
          path: candidate
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Logic-test dependencies (Params falls back to its in-memory implementation on x86)
        run: |
          python -m pip install scons numpy crcmod tqdm pycapnp==2.1.0 pycryptodome cffi pytest pytest-subtests \
            pytest-mock "hypothesis==6.47.*" "parameterized<0.9" libusb1 pyzmq setproctitle

      - name: Build libsafety (x86) from the candidate
        working-directory: candidate/opendbc_repo
        run: scons -j4 opendbc/safety/tests/libsafety/libsafety.so

      - name: Mazda/TI logic tests
        working-directory: candidate
        env:
          PYTHONPATH: ${{ github.workspace }}/candidate:${{ github.workspace }}/candidate/opendbc_repo:${{ github.workspace }}/candidate/starpilot/third_party
        run: |
          set -o pipefail
          python -m pytest --noconftest -o addopts='' -q \
            opendbc_repo/opendbc/safety/tests/test_mazda_ti.py opendbc_repo/opendbc/safety/tests/test_mazda.py | tee ../tests.txt
          python -m pytest --noconftest -o addopts='' -q opendbc_repo/opendbc/car/mazda/tests/test_mazda_ti_integration.py | tee -a ../tests.txt
          python -m pytest --noconftest -o addopts='' -q -k "mazda or MAZDA" \
            opendbc_repo/opendbc/car/tests/test_car_interfaces.py opendbc_repo/opendbc/car/tests/test_fw_fingerprint.py \
            opendbc_repo/opendbc/car/tests/test_mazda3_fingerprint.py | tee -a ../tests.txt
          python -m pytest --noconftest -o addopts='' -q selfdrive/pandad/tests/test_pandad_tici_discovery.py \
            selfdrive/controls/tests/test_longcontrol_mazda_ti.py | tee -a ../tests.txt

      - name: Classify (trusted policy) and check the tici build stamp
        run: |
          python trusted/${TRUSTED}/sync/classify.py --repo candidate --candidate "${{ needs.sync.outputs.candidate }}" \
            --policy trusted/${TRUSTED}/policy --from "${{ needs.sync.outputs.previous_upstream }}" --report classify.md
          cat classify.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: mazda-ti-autosync-${{ needs.sync.outputs.candidate }}
          path: |
            classify.md
            tests.txt

  report:
    needs: [sync, test]
    if: always() && needs.sync.outputs.status == 'MERGED' && !inputs.dry_run
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pull-requests: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: mazda-ti-autosync-${{ needs.sync.outputs.candidate }}
        continue-on-error: true

      - name: Open or update the single sync PR (never merged automatically)
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.sync.outputs.candidate }}
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          verdict=$(sed -n 's/^VERDICT=//p' classify.md 2>/dev/null | head -1)
          verdict=${verdict:-UNKNOWN}
          {
            echo "Automated merge of official StarPilot into \`${INTEGRATION_BRANCH}\` for candidate \`${SHA}\`."
            echo
            echo "- Tests: **${TEST_RESULT}**"
            echo "- Verdict: **${verdict}** (READY only when the tici build stamp verifies for this exact SHA)"
            echo "- This PR is never merged, deployed or flashed automatically. A device rebuild"
            echo "  (mazda-ti/sync/device_rebuild.sh) and vehicle validation stay manual."
            echo
            cat classify.md 2>/dev/null || true
          } > body.md
          title="mazda-ti autosync: official StarPilot ${SHA:0:12} [${verdict}]"
          number=$(gh pr list -R "${GITHUB_REPOSITORY}" --head "${CANDIDATE_BRANCH}" --base "${INTEGRATION_BRANCH}" \
                     --state open --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh pr edit "$number" -R "${GITHUB_REPOSITORY}" --title "$title" --body-file body.md
          else
            gh pr create -R "${GITHUB_REPOSITORY}" --head "${CANDIDATE_BRANCH}" --base "${INTEGRATION_BRANCH}" \
              --draft --title "$title" --body-file body.md
          fi
